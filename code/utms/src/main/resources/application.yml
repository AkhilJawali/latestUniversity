spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: utms

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: utms

  flyway:
    enabled: true
    schemas: utms
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
