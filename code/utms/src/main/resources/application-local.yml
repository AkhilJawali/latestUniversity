spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/utms
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.utms: DEBUG
    org.hibernate.SQL: DEBUG
